<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 280px;
      padding: 16px;
    }
    h1 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; }
    .site-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #1e2130;
      font-size: 0.82rem;
    }
    .site-row:last-of-type { border-bottom: none; }
    .unlocked { color: #22c55e; }
    .locked   { color: #475569; }
    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }
    button {
      background: none;
      border: 1px solid #2d3148;
      color: #94a3b8;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button:hover { background: #1e2130; }
    .empty { color: #475569; font-size: 0.82rem; }
  </style>
</head>
<body>
  <h1>Anki Gate</h1>
  <div id="list"><p class="empty">No sites configured.</p></div>
  <div class="footer">
    <button id="settingsBtn">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
